%YAML:1.0 # need to specify the file type at the top!
# NOTE: %YAML:1.0 must stay on line 1 — cv::FileStorage rejects the file otherwise.
# FLIGHT / DEPLOYMENT configuration (NOT for calibration runs).
# This is the estimator configuration that produced 2.4-4.5 cm SE(3) ATE and
# 3.1-5.6 cm anchored error across an 11-flight, 3-vehicle fisheye benchmark
# (uniform settings, no per-vehicle or per-flight tuning).
# USE WITH configs/flight_stiffness.env sourced into the environment — the
# tightened calibration priors are half of what makes this config work.
# For CALIBRATION runs use configs/estimator_fleet.yaml with OV_PRIOR_* UNSET.
# See README section "Two configurations: calibration mode vs flight mode".
# ============================================================================

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: false   # overridden to true via --ros-args -p use_stereo:=true
max_cameras: 4

calib_cam_extrinsics: true
calib_cam_intrinsics: true
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 50
max_slam: 250
max_slam_in_update: 150
max_msckf_in_update: 1000
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: true
zupt_chi2_multipler: 0
zupt_max_velocity: 0.05
zupt_noise_multiplier: 5
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

init_window_time: 3.0
init_imu_thresh: 1.5
init_max_disparity: 30.0
init_max_features: 200

init_dyn_use: true
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [ 0.0, 0.0, 0.0 ]
init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]

record_timing_information: false
# The scratch paths below are fixed and absolute; inert while the two flags are false.
# Give concurrent replays their own paths before enabling either.
record_timing_filepath: "/tmp/traj_timing.txt"
save_total_state: false
filepath_est: "/tmp/openvins_est.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

update_min_dt: 0.125   # EKF clone/update at 7.5Hz; KLT keeps tracking at full rate
init_force_static: true # anchor trajectory in the pre-takeoff static phase (raw/NOUMCAL-optimal;
                        # set false + zupt_noise_multiplier 10 + zupt_max_velocity 0.1 for the
                        # shape-optimal twin: POSTG 7.88 vs 8.12, NOUMCAL 10.97 vs 8.42)
use_klt: true
# use_klt_tangent/klt_tangent_patch_size intentionally absent: the tangent-image tracker
# was removed from this pruned OpenVINS (it never executed — see openvins/PRUNED.txt).
num_pts: 3000
fast_threshold: 30
grid_x: 5
grid_y: 5
min_px_dist: 15
knn_ratio: 0.70
track_frequency: 40.0   # track EVERY frame (30Hz cams); accuracy comes from update_min_dt below
downsample_cameras: false
num_opencv_threads: 0  # det-live
histogram_method: "CLAHE"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 0.7
up_slam_sigma_px: 1
up_slam_chi2_multipler: 0.7
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: true
mask_fisheye_auto: true
mask_fisheye_theta_max: 1.83
mask_fisheye_theta_max3: 1.87
mask_fisheye_inset_px: 4.0
mask_fisheye_dynamic: true
mask_fisheye_dyn_thresh_px: 1.0
mask_bottom_frac: 0.0

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
